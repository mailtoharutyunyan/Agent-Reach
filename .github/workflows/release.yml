name: release

# Publishes to PyPI and creates a GitHub Release when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# The tag must match `__version__` in weblens/__init__.py. See RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint and tests
    uses: ./.github/workflows/pytest.yml

  build:
    name: Build distributions
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse to release with placeholder repository URLs
        run: |
          # Built from two parts so the RELEASING.md replace command cannot rewrite it.
          placeholder="YOUR_GITHUB""_USER"
          if grep -rIl "$placeholder" --exclude-dir=.git --exclude=RELEASING.md .; then
            echo "::error::Replace the ${placeholder} placeholder before releasing (see RELEASING.md step 1)"
            exit 1
          fi

      - name: Verify tag matches package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import re, pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('weblens/__init__.py').read_text(), re.M).group(1))")"
          echo "tag=${tag} package=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Tag v${tag} does not match __version__ ${version} in weblens/__init__.py"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          test "$(/tmp/smoke/bin/weblens --version)" = "WebLens v${GITHUB_REF_NAME#v}"
          cd /tmp && /tmp/smoke/bin/python -c "from importlib.resources import files; assert (files('weblens')/'skill'/'SKILL.md').is_file()"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/weblens/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no API token needed
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Install or upgrade: `pip install --upgrade weblens==${{ needs.build.outputs.version }}`

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes.
