[project]
name = "weblens"
dynamic = ["version"]
description = "Give AI agents reliable read and search access to the web: YouTube, GitHub, Hacker News, Wikipedia, arXiv, Stack Overflow, Reddit, X and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Arayik"}]
maintainers = [{name = "Arayik"}]
keywords = [
    "ai-agents", "llm", "llm-tools", "agent-skills", "mcp", "claude-code",
    "web-reader", "web-search", "web-scraping", "cli",
    "youtube-transcript", "github", "hacker-news", "wikipedia", "arxiv",
    "stack-overflow", "reddit", "twitter", "rss",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "yt-dlp[default]>=2026.07.04",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
cookies = ["browser-cookie3>=0.19"]
mcp = ["mcp[cli]>=1.0,<2"]
all = ["playwright>=1.40", "mcp[cli]>=1.0,<2", "browser-cookie3>=0.19"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
weblens = "weblens.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USER/weblens"
Documentation = "https://github.com/YOUR_GITHUB_USER/weblens#readme"
Repository = "https://github.com/YOUR_GITHUB_USER/weblens"
Issues = "https://github.com/YOUR_GITHUB_USER/weblens/issues"
Changelog = "https://github.com/YOUR_GITHUB_USER/weblens/blob/main/CHANGELOG.md"

[build-system]
# hatchling >= 1.27 implements PEP 639 (SPDX `license` + `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Single source of truth for the version: `__version__` in weblens/__init__.py.
[tool.hatch.version]
path = "weblens/__init__.py"

# Non-Python runtime files (weblens/skill/**, weblens/guides/*.md,
# weblens/scripts/*.sh, weblens/py.typed) live inside the package directory,
# so hatchling ships them automatically.
[tool.hatch.build.targets.wheel]
packages = ["weblens"]
exclude = ["**/__pycache__", "**/*.py[co]"]

[tool.hatch.build.targets.sdist]
include = [
    "/weblens",
    "/tests",
    "/docs",
    "/test.sh",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/constraints.txt",
]
exclude = ["**/__pycache__", "**/*.py[co]"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade (py310 syntax)
select = ["E", "W", "F", "I", "B", "UP"]
# Long user-facing strings (install hints, URLs) are kept on one line so they
# stay greppable; line length is not enforced.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
